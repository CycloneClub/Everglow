# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and Test

on:
  push:
    branches: [ "master", "Yggdrasil/newContent0"]
  pull_request:
    branches: [ "master", "Yggdrasil/newContent0"]

jobs:
  build-and-test:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Fetch full git history
      run: |
        # Unshallow current branch to get full commit history
        git fetch --unshallow || true
        # Fetch latest master for comparison
        git fetch origin master

    - name: Compare with master
      run: |
        $count = git rev-list --count HEAD..origin/master
        Write-Host "Commits behind master: $count"

        if ($count -ne 0) {
          Write-Error "❌ This branch is behind origin/master"
          exit 1
        }

        Write-Host "✅ Branch is up to date with origin/master"
  
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Restore dependencies
      run: |
          Copy-Item -LiteralPath .\.github\workflows\Directory.Build.props -Destination .\Sources\Directory.Build.props -Force
          dotnet restore

    - name: Pull TML
      run: |
          Copy-Item -LiteralPath .\.github\workflows\tModLoader.targets -Destination ..\tModLoader.targets -Force
          cd ..
          mkdir ./tmod

          cd ./tmod
          curl -L -o tModLoader.zip https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip
          # wget https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip
          unzip tModLoader.zip
          cd ..
          cd ./Everglow

    - name: Download XNA Framework Redistributable
      shell: pwsh
      run: |
        Invoke-WebRequest `
          -Uri "https://download.microsoft.com/download/a/c/2/ac2c903b-e6e8-42c2-9fd7-bebac362a930/xnafx40_redist.msi" `
          -OutFile "xnafx40_redist.msi"

    - name: Install XNA Framework Redistributable
      shell: pwsh
      run: |
        Start-Process msiexec.exe -ArgumentList "/i xnafx40_redist.msi /quiet /norestart" -Wait

    - name: Build
      run: dotnet build /p:Configuration=Release
      
    - name: Test
      run: dotnet test --configuration Release --no-build --no-restore --verbosity normal
