# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ "1.4.4", "Yggdrasil/newContent0"]
  pull_request:
    branches: [ "1.4.4", "Yggdrasil/newContent0"]

permissions:
  contents: read

jobs:
  build-and-test:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Fetch full git history
      run: |
        # Unshallow current branch to get full commit history
        git fetch --unshallow || true
        # Fetch latest 1.4.4 for comparison
        git fetch origin 1.4.4

    - name: Compare with 1.4.4
      run: |
        $count = git rev-list --count HEAD..origin/1.4.4
        Write-Host "Commits behind 1.4.4: $count"

        if ($count -ne 0) {
          Write-Error "❌ This branch is behind origin/1.4.4"
          exit 1
        }

        Write-Host "✅ Branch is up to date with origin/1.4.4"
  
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Restore dependencies
      run: |
          Copy-Item -LiteralPath .\.github\workflows\Directory.Build.props -Destination .\Sources\Directory.Build.props -Force
          dotnet restore

    - name: Pull TML
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Copy-Item -LiteralPath ./.github/workflows/tModLoader.targets -Destination ../tModLoader.targets -Force
        New-Item -ItemType Directory -Path ../tmod | Out-Null
        # Keep the original archive so every platform tests the exact build-time tML release.
        Invoke-WebRequest 'https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip' -OutFile ../tmod/tModLoader.zip
        Expand-Archive -LiteralPath ../tmod/tModLoader.zip -DestinationPath ../tmod

    - name: Download XNA Framework Redistributable
      shell: pwsh
      run: |
        Invoke-WebRequest `
          -Uri "https://download.microsoft.com/download/a/c/2/ac2c903b-e6e8-42c2-9fd7-bebac362a930/xnafx40_redist.msi" `
          -OutFile "xnafx40_redist.msi"

    - name: Install XNA Framework Redistributable
      shell: pwsh
      run: |
        Start-Process msiexec.exe -ArgumentList "/i xnafx40_redist.msi /quiet /norestart" -Wait

    - name: Build
      run: dotnet build /p:Configuration=Release
      
    - name: Test
      run: dotnet test --configuration Release --no-build --no-restore --verbosity normal

    - name: Test load result checks
      shell: pwsh
      run: ./.github/workflows/scripts/Test-ModLoadResult.Tests.ps1

    - name: Download runtime mod dependencies
      shell: pwsh
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = 'Stop'
        $steamcmd = Join-Path $env:RUNNER_TEMP 'steamcmd'
        New-Item -ItemType Directory -Path $steamcmd -Force | Out-Null
        Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$steamcmd/steamcmd.zip"
        Expand-Archive -LiteralPath "$steamcmd/steamcmd.zip" -DestinationPath $steamcmd
        # The bootstrapper exits 7 after updating and spawning its replacement.
        # -Wait waits for the process tree, including that replacement.
        $bootstrap = Start-Process "$steamcmd/steamcmd.exe" -ArgumentList '+quit' -WorkingDirectory $steamcmd -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "$steamcmd/bootstrap.log" -RedirectStandardError "$steamcmd/bootstrap-error.log"
        if ($bootstrap.ExitCode -notin @(0, 7)) { throw "SteamCMD bootstrap exited with code $($bootstrap.ExitCode)" }
        $download = Start-Process "$steamcmd/steamcmd.exe" `
          -ArgumentList '+login anonymous +workshop_download_item 1281930 2785100219 +workshop_download_item 1281930 3539368598 +quit' `
          -WorkingDirectory $steamcmd -WindowStyle Hidden -Wait -PassThru `
          -RedirectStandardOutput "$steamcmd/download.log" -RedirectStandardError "$steamcmd/download-error.log"
        Get-Content "$steamcmd/download.log"
        if ($download.ExitCode -ne 0) { throw "SteamCMD download exited with code $($download.ExitCode)" }

    - name: Prepare shared load test inputs
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $inputs = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/tml-load-inputs"
        $buildConfig = Get-Content './Sources/Everglow/obj/BuildConfig.json' -Raw | ConvertFrom-Json
        Copy-Item -LiteralPath (Join-Path $buildConfig.ModDirectory 'Everglow.tmod') -Destination $inputs.FullName
        Copy-Item -LiteralPath ../tmod/tModLoader.zip -Destination $inputs.FullName
        # Preserve Workshop metadata and all version folders for tML's dependency selection.
        Copy-Item -LiteralPath "$env:RUNNER_TEMP/steamcmd/steamapps/workshop" -Destination "$($inputs.FullName)/workshop" -Recurse

    - name: Upload shared load test inputs
      uses: actions/upload-artifact@v4
      with:
        name: tmodloader-load-inputs
        path: ${{ runner.temp }}/tml-load-inputs/
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

    - name: Upload SteamCMD logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tmodloader-steamcmd-logs
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/steamcmd/logs/workshop_log.txt
          ${{ runner.temp }}/steamcmd/download*.log
          ${{ runner.temp }}/steamcmd/bootstrap*.log

  load-test:
    name: Server load (${{ matrix.platform }})
    needs: build-and-test
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hosted x64 Windows images are Windows Server, not desktop Windows.
          - platform: windows-server-2022
            runner: windows-2022
          - platform: windows-latest
            runner: windows-latest
          # tML ships x64 Windows native libraries, so test Win11 ARM via x64 emulation.
          - platform: windows-11-arm-x64-emulated
            runner: windows-11-arm
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
          - platform: ubuntu-24.04
            runner: ubuntu-24.04
          - platform: ubuntu-26.04
            runner: ubuntu-26.04
          # Containers cover distro userspace; they share the Ubuntu host kernel.
          - platform: debian-12
            runner: ubuntu-24.04
            container: mcr.microsoft.com/dotnet/sdk:8.0-bookworm-slim
          - platform: azure-linux-3.0
            runner: ubuntu-24.04
            container: mcr.microsoft.com/dotnet/sdk:8.0-azurelinux3.0
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET 8.0
      if: ${{ !matrix.container && matrix.runner != 'windows-11-arm' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup x64 .NET 8.0 runtime on Windows 11 ARM
      if: matrix.runner == 'windows-11-arm'
      run: |
        $ErrorActionPreference = 'Stop'
        $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
        $dotnetDirectory = Join-Path $env:RUNNER_TEMP 'dotnet-x64'
        Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installer
        & $installer -Channel 8.0 -Runtime dotnet -Architecture x64 -InstallDir $dotnetDirectory -NoPath
        & "$dotnetDirectory/dotnet.exe" --info
        if ($LASTEXITCODE -ne 0) { throw "x64 .NET runtime failed: $LASTEXITCODE" }
        $dotnetDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "DOTNET_ROOT=$dotnetDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "DOTNET_ROOT_X64=$dotnetDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Record load test environment
      run: |
        [Runtime.InteropServices.RuntimeInformation]::OSDescription
        [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
        [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture
        if ($IsLinux) { Get-Content /etc/os-release }
        dotnet --info

    - name: Download shared load test inputs
      uses: actions/download-artifact@v4
      with:
        name: tmodloader-load-inputs
        path: ${{ runner.temp }}/tml-load-inputs

    - name: Extract tModLoader
      run: |
        Expand-Archive -LiteralPath "$env:RUNNER_TEMP/tml-load-inputs/tModLoader.zip" -DestinationPath "$env:RUNNER_TEMP/tmod"

    - name: Test load result checks
      run: ./.github/workflows/scripts/Test-ModLoadResult.Tests.ps1

    - name: Load Everglow in tModLoader
      timeout-minutes: 10
      run: |
        ./.github/workflows/scripts/Test-TModLoaderLoad.ps1 `
          -TmlDirectory "$env:RUNNER_TEMP/tmod" `
          -ModFile "$env:RUNNER_TEMP/tml-load-inputs/Everglow.tmod" `
          -WorkshopDirectory "$env:RUNNER_TEMP/tml-load-inputs/workshop" `
          -RunDirectory "$env:RUNNER_TEMP/tml-load-test" `
          -TimeoutSeconds 300

    - name: Upload tModLoader load logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tmodloader-load-logs-${{ matrix.platform }}
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/tml-load-test/server.log
          ${{ runner.temp }}/tml-load-test/runtime/tModLoader-Logs/server*.log
          ${{ runner.temp }}/tml-load-test/stdout.log
          ${{ runner.temp }}/tml-load-test/stderr.log
          ${{ runner.temp }}/tml-load-test/mod-sha256.txt
