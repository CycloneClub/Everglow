# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ "1.4.4", "Yggdrasil/newContent0"]
  pull_request:
    branches: [ "1.4.4", "Yggdrasil/newContent0"]

jobs:
  build-and-test:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Fetch full git history
      run: |
        # Unshallow current branch to get full commit history
        git fetch --unshallow || true
        # Fetch latest 1.4.4 for comparison
        git fetch origin 1.4.4

    - name: Compare with 1.4.4
      run: |
        $count = git rev-list --count HEAD..origin/1.4.4
        Write-Host "Commits behind 1.4.4: $count"

        if ($count -ne 0) {
          Write-Error "❌ This branch is behind origin/1.4.4"
          exit 1
        }

        Write-Host "✅ Branch is up to date with origin/1.4.4"
  
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: '**/*.csproj'

    - name: Restore dependencies
      run: |
          Copy-Item -LiteralPath .\.github\workflows\Directory.Build.props -Destination .\Sources\Directory.Build.props -Force
          dotnet restore

    - name: Pull TML
      run: |
          Copy-Item -LiteralPath .\.github\workflows\tModLoader.targets -Destination ..\tModLoader.targets -Force
          cd ..
          mkdir ./tmod

          cd ./tmod
          curl -L -o tModLoader.zip https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip
          # wget https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip
          unzip tModLoader.zip
          cd ..
          cd ./Everglow

    - name: Download XNA Framework Redistributable
      shell: pwsh
      run: |
        Invoke-WebRequest `
          -Uri "https://download.microsoft.com/download/a/c/2/ac2c903b-e6e8-42c2-9fd7-bebac362a930/xnafx40_redist.msi" `
          -OutFile "xnafx40_redist.msi"

    - name: Install XNA Framework Redistributable
      shell: pwsh
      run: |
        Start-Process msiexec.exe -ArgumentList "/i xnafx40_redist.msi /quiet /norestart" -Wait

    - name: Build
      run: dotnet build /p:Configuration=Release
      
    - name: Test
      run: dotnet test --configuration Release --no-build --no-restore --verbosity normal

    - name: Test load result checks
      shell: pwsh
      run: ./.github/workflows/scripts/Test-ModLoadResult.Tests.ps1

    - name: Download runtime mod dependencies
      shell: pwsh
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = 'Stop'
        $steamcmd = Join-Path $env:RUNNER_TEMP 'steamcmd'
        New-Item -ItemType Directory -Path $steamcmd -Force | Out-Null
        Invoke-WebRequest 'https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip' -OutFile "$steamcmd/steamcmd.zip"
        Expand-Archive -LiteralPath "$steamcmd/steamcmd.zip" -DestinationPath $steamcmd
        # The bootstrapper exits 7 after updating and spawning its replacement.
        # -Wait waits for the process tree, including that replacement.
        $bootstrap = Start-Process "$steamcmd/steamcmd.exe" -ArgumentList '+quit' -WorkingDirectory $steamcmd -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "$steamcmd/bootstrap.log" -RedirectStandardError "$steamcmd/bootstrap-error.log"
        if ($bootstrap.ExitCode -notin @(0, 7)) { throw "SteamCMD bootstrap exited with code $($bootstrap.ExitCode)" }
        $download = Start-Process "$steamcmd/steamcmd.exe" `
          -ArgumentList '+login anonymous +workshop_download_item 1281930 2785100219 +workshop_download_item 1281930 3539368598 +quit' `
          -WorkingDirectory $steamcmd -WindowStyle Hidden -Wait -PassThru `
          -RedirectStandardOutput "$steamcmd/download.log" -RedirectStandardError "$steamcmd/download-error.log"
        Get-Content "$steamcmd/download.log"
        if ($download.ExitCode -ne 0) { throw "SteamCMD download exited with code $($download.ExitCode)" }

    - name: Load Everglow in tModLoader
      shell: pwsh
      timeout-minutes: 10
      run: |
        $buildConfig = Get-Content './Sources/Everglow/obj/BuildConfig.json' -Raw | ConvertFrom-Json
        ./.github/workflows/scripts/Test-TModLoaderLoad.ps1 `
          -TmlDirectory '../tmod' `
          -ModFile (Join-Path $buildConfig.ModDirectory 'Everglow.tmod') `
          -WorkshopDirectory "$env:RUNNER_TEMP/steamcmd/steamapps/workshop" `
          -RunDirectory "$env:RUNNER_TEMP/tml-load-test" `
          -TimeoutSeconds 300

    - name: Upload tModLoader load logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tmodloader-load-logs
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/tml-load-test/server.log
          ${{ runner.temp }}/tml-load-test/runtime/tModLoader-Logs/server*.log
          ${{ runner.temp }}/tml-load-test/stdout.log
          ${{ runner.temp }}/tml-load-test/stderr.log
          ${{ runner.temp }}/tml-load-test/mod-sha256.txt
          ${{ runner.temp }}/steamcmd/logs/workshop_log.txt
          ${{ runner.temp }}/steamcmd/download*.log
          ${{ runner.temp }}/steamcmd/bootstrap*.log
